name: Update screener

on:
  schedule:
    - cron: "30 22 * * *"   # every day 22:30 UTC (after the US close, before Asia opens)
  workflow_dispatch: {}      # "Run workflow" button for a manual update
  push:                      # redeploy when the page or the collector changes
    branches: [main]
    paths: ["docs/**", "collector/**", "requirements.txt"]

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to save state/state.json (crypto top-10 history)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect data and compute metrics
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python collector/build.py

      - name: Save state (crypto membership history)
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add state/state.json
          git commit -m "state: $(date -u +%F)" || echo "no state change"
          git push

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
