name: Update screener

on:
  schedule:
    - cron: "30 22 * * *"   # every day 22:30 UTC (after the US close, before Asia opens)
  workflow_dispatch: {}      # "Run workflow" button for a manual update

permissions:
  contents: write   # to save state/state.json (crypto top-10 history)
  pages: write
  id-token: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect data and compute metrics
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python collector/build.py

      - name: Save state (crypto membership history)
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add state/state.json
          git commit -m "state: $(date -u +%F)" || echo "no state change"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
